[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snakes-and-ladders-markov"
version = "1.0.0"
description = "Cobras e Escadas: Monte Carlo validado por cadeia de Markov exata"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Carlos Alberto Monteiro da Cunha" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
analise = ["matplotlib>=3.7", "pandas>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cobras-escadas = "cobras_escadas:main"

[tool.setuptools]
package-dir = { "" = "python" }
py-modules = ["cobras_escadas", "cobras_escadas_simples"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: testes estatísticos mais demorados"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
# Nomes maiúsculos (P, Q, S, E, J) seguem a notação matemática de cadeias de Markov.
ignore = ["N806", "N802", "N803"]

[tool.ruff.lint.isort]
known-first-party = ["cobras_escadas", "cobras_escadas_simples"]
