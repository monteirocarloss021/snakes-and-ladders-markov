name: CI

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Simulação + conferência exata (versão completa)
        run: python python/cobras_escadas.py
      - name: Versão simples
        run: python python/cobras_escadas_simples.py

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -o cobras cpp/cobras_escadas.cpp
      - name: Rodar
        run: ./cobras
