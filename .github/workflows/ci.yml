name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
      - uses: astral-sh/ruff-action@v1
        with:
          args: format --check

  python:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Testes
        run: pytest
      - name: Solução completa (simulação x exato)
        run: python python/cobras_escadas.py
      - name: Versão simples
        run: python python/cobras_escadas_simples.py

  cpp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Compilar (${{ matrix.compiler }})
        run: make cpp CXX=${{ matrix.compiler }}
      - name: Rodar
        run: ./cobras
      - name: AddressSanitizer + UBSan
        run: make sanitize CXX=${{ matrix.compiler }}
